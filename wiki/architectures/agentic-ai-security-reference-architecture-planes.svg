<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Trust boundaries and flows in the reference agent deployment</title>
  <desc id="description">A support analyst enters an organization-operated cloud tenant. An isolated agent reaches internal case state and documents through a retrieval mediator, a vendor model through a model gateway, and an external refund provider through an action gateway. The gateway requests scoped access from the credential broker, receives it, and uses it for the approved provider write. Policy, approval, release admission, and an independent evidence store sit outside the agent process. Dashed outlines mark lower-trust text and external providers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#275985"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#697786"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#152a3b}
      .heading{font-size:29px;font-weight:700}
      .sub{font-size:17px;fill:#4c6475}
      .zone{font-size:18px;font-weight:700;letter-spacing:.3px}
      .name{font-size:20px;font-weight:700}
      .detail{font-size:15px;fill:#4c6475}
      .edge-label{font-size:14px;font-weight:700;fill:#275985}
      .tenant{fill:#f5f9fc;stroke:#315c7c;stroke-width:2.5}
      .outside{fill:#fff8ef;stroke:#b77939;stroke-width:2.5;stroke-dasharray:9 6}
      .content{fill:#fff8ef;stroke:#b77939;stroke-width:2;stroke-dasharray:8 5}
      .box{fill:#fff;stroke:#7994a8;stroke-width:2}
      .gate{fill:#e9f3fa;stroke:#46789b;stroke-width:2}
      .record{fill:#edf4ed;stroke:#648464;stroke-width:2}
      .flow{fill:none;stroke:#275985;stroke-width:3;marker-end:url(#arrow)}
      .flow-muted{fill:none;stroke:#697786;stroke-width:2.5;stroke-dasharray:6 5;marker-end:url(#arrow-muted)}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>
  <text class="heading" x="42" y="50">Reference deployment: support agent with refund authority</text>
  <text class="sub" x="42" y="78">Arrows show permitted paths. Each gateway makes a separate decision.</text>

  <rect class="tenant" x="255" y="112" width="980" height="736" rx="22"/>
  <text class="zone" x="286" y="146">Organization-operated cloud tenant</text>

  <rect class="outside" x="1272" y="150" width="286" height="173" rx="18"/>
  <text class="zone" x="1294" y="183">Model provider</text>
  <text class="detail" x="1294" y="217">Outside tenant</text>
  <text class="detail" x="1294" y="244">Receives selected context</text>
  <text class="detail" x="1294" y="271">Returns proposals as data</text>

  <rect class="outside" x="1272" y="503" width="286" height="169" rx="18"/>
  <text class="zone" x="1294" y="536">Refund provider</text>
  <text class="detail" x="1294" y="570">Outside tenant</text>
  <text class="detail" x="1294" y="597">Accepts approved writes</text>
  <text class="detail" x="1294" y="624">Returns uncertain or final state</text>

  <rect class="box" x="36" y="205" width="170" height="114" rx="13"/>
  <text class="name" x="55" y="246">Support</text>
  <text class="name" x="55" y="270">analyst</text>
  <text class="detail" x="55" y="296">Human initiator</text>

  <rect class="gate" x="298" y="194" width="200" height="120" rx="13"/>
  <text class="name" x="316" y="236">Identity and</text>
  <text class="name" x="316" y="262">session</text>
  <text class="detail" x="316" y="290">User + scoped task</text>

  <rect class="box" x="554" y="194" width="230" height="120" rx="13"/>
  <text class="name" x="573" y="236">Isolated agent</text>
  <text class="name" x="573" y="262">runtime</text>
  <text class="detail" x="573" y="290">No direct secrets or API path</text>

  <rect class="gate" x="847" y="194" width="250" height="120" rx="13"/>
  <text class="name" x="867" y="236">Model gateway</text>
  <text class="detail" x="867" y="266">Route + context limit</text>
  <text class="detail" x="867" y="290">Provider record</text>

  <rect class="content" x="286" y="526" width="241" height="142" rx="17"/>
  <text class="zone" x="305" y="560">Internal sources</text>
  <text class="detail" x="305" y="588">Current case fields</text>
  <text class="detail" x="305" y="616">Refund policy text</text>
  <text class="detail" x="305" y="640">Lower-trust instructions</text>

  <rect class="gate" x="298" y="379" width="214" height="114" rx="13"/>
  <text class="name" x="316" y="420">Retrieval</text>
  <text class="name" x="316" y="445">mediator</text>
  <text class="detail" x="316" y="472">Entitlement per record</text>

  <rect class="gate" x="554" y="379" width="230" height="114" rx="13"/>
  <text class="name" x="573" y="420">Policy service</text>
  <text class="detail" x="573" y="452">Fresh action decision</text>
  <text class="detail" x="573" y="475">Versioned rules</text>

  <rect class="gate" x="847" y="379" width="250" height="114" rx="13"/>
  <text class="name" x="867" y="420">Action gateway</text>
  <text class="detail" x="867" y="452">Schema + policy + approval</text>
  <text class="detail" x="867" y="475">Only refund API route</text>

  <rect class="gate" x="554" y="539" width="230" height="118" rx="13"/>
  <text class="name" x="573" y="581">Approval service</text>
  <text class="detail" x="573" y="610">Exact action facts</text>
  <text class="detail" x="573" y="633">Single-use approval</text>

  <rect class="gate" x="847" y="539" width="250" height="118" rx="13"/>
  <text class="name" x="867" y="581">Credential broker</text>
  <text class="detail" x="867" y="610">Issues access to gateway</text>
  <text class="detail" x="867" y="633">Scoped to provider</text>

  <rect class="record" x="298" y="715" width="294" height="87" rx="13"/>
  <text class="name" x="317" y="749">Release admission</text>
  <text class="detail" x="317" y="777">Image + config before startup</text>

  <rect class="record" x="720" y="715" width="377" height="87" rx="13"/>
  <text class="name" x="740" y="749">Independent evidence store</text>
  <text class="detail" x="740" y="777">Task-linked decisions and outcomes</text>

  <path class="flow" d="M206 260H298"/>
  <path class="flow" d="M498 260H554"/>
  <path class="flow" d="M784 260H847"/>
  <path class="flow" d="M1097 260H1272"/>
  <text class="edge-label" x="1114" y="246">Minimized context</text>

  <path class="flow" d="M620 314V345H405V379"/>
  <text class="edge-label" x="420" y="363">Query / chunks</text>
  <path class="flow" d="M405 493V526"/>
  <path class="flow" d="M512 462H554"/>

  <path class="flow" d="M738 314V350H972V379"/>
  <text class="edge-label" x="820" y="344">Refund proposal</text>
  <path class="flow" d="M847 437H784"/>
  <text class="edge-label" x="787" y="425">Decide</text>
  <path class="flow" d="M784 598H813V463H847"/>
  <text class="edge-label" x="692" y="526">Approval</text>
  <path class="flow" d="M972 493V539" marker-start="url(#arrow)"/>
  <path class="flow" d="M1097 437H1190V587H1272"/>
  <text class="edge-label" x="1127" y="426">Approved write</text>

  <path class="flow-muted" d="M592 758H533V332H669V314"/>
  <text class="detail" x="316" y="695">Admit before run</text>
  <path class="flow-muted" d="M972 657V715"/>
  <path class="flow-muted" d="M1097 463H1165V685H1070V715"/>
  <text class="detail" x="770" y="693">Correlated events</text>

  <line x1="40" y1="864" x2="94" y2="864" stroke="#275985" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="detail" x="110" y="870">Permitted flow</text>
  <rect x="290" y="851" width="36" height="22" class="outside" rx="4"/>
  <text class="detail" x="341" y="870">External or lower-trust boundary</text>
  <text class="detail" x="892" y="870">Responses return as untrusted data</text>
</svg>
